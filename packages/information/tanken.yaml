mqtt:
  sensor:
    - name: "Tankstelle Kaufland"
      unit_of_measurement: '€'    
      state_topic: "tanken/kaufland"

    - name: "Tankstelle Borussiastraße"
      unit_of_measurement: '€'
      state_topic: "tanken/borussiastrasse"

automation:
  - alias: "Tanken Telegram"
    id: "tanken_telegram"
    trigger:
      platform: event
      event_type: telegram_command
      event_data:
        command: '/tanken'
    action:
      - service: notify.telegram
        data:
          title: "Aktuelle Benzinpreise"
          message: >
            {% set kauflandPrice = states('sensor.sensor.supermarkt_tankstelle_kaufland_dortmund_wulfshofstr_e10') %}
            {% set kauflandText = (kauflandPrice | float) ~ '€' if kauflandPrice != 'unknown' else ('geschlossen' if is_state('binary_sensor.supermarkt_tankstelle_wulfshofstrasse_6_8_status', 'off') else '-') %}

            {% set borussiaStrassePrice = states('sensor.sb_borussiastrasse_118_super_e10') %}
            {% set borussiaStrasseText = (borussiaStrassePrice | float) ~ '€' if borussiaStrassePrice != 'unknown' else ('geschlossen' if is_state('binary_sensor.sb_borussiastrasse_118_status', 'off') else '-') %}

            {{ 'Kaufland: ' ~ kauflandText }}       
            
            {{ 'Borusiastraße: ' ~ borussiaStrasseText }}    

  - alias: "Tanken Preis"
    id: "tanken_preis"
    mode: parallel
    trigger:
      - platform: state
        id: "tanken/kaufland"
        entity_id: sensor.supermarkt_tankstelle_kaufland_dortmund_wulfshofstr_e10
      - platform: state
        id: "tanken/borussiastrasse"
        entity_id: sensor.sb_borussiastrasse_118_super_e10      
    condition:
      - "{{ trigger.to_state.state != 'unknown' }}"
      - "{{ trigger.to_state.state != 'unavailable' }}"      
    action:
      - service: mqtt.publish
        data:
          topic: "{{ trigger.id }}"          
          payload: "{{ states(trigger.entity_id) }}"
          retain: true

homeassistant:
  customize:           
    sensor.sensor.supermarkt_tankstelle_kaufland_dortmund_wulfshofstr_e10:
      friendly_name: Tankstelle Kaufland
    sensor.sb_borussiastrasse_118_super_e10:
      friendly_name: Tankstelle Borussiastraße     