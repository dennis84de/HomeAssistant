template:
  - sensor:
      - name: "Bewegungsmelder deaktiviert"
        unique_id: bewegungsmelder_deaktiviert
        icon: mdi:nas
        state: >
          {% set motionSensorDeactivated = expand('group.bewegungsmelder_deaktiviert')
            | selectattr('state','eq','on') 
            | list
            | length %}
            
          {{ motionSensorDeactivated }}
          
      - name: "Lichter eingeschaltet"
        unique_id: lichter_einggeschaltet        
        state: >
          {% set lichterEingeschaltet = expand('group.licht_schlafen')
            | selectattr('state','eq','on') 
            | list
            | length %}
            
          {{ lichterEingeschaltet }}    
        attributes:
          lichter: >
            {% set lichterEingeschaltet = expand('group.licht_schlafen')
              | selectattr('state','eq','on') 
              | map(attribute='name')
              | list %}

              {{ lichterEingeschaltet }}               
          
script:
  licht_wohnung_ausschalten:
    alias: Licht Wohnung ausschalten
    sequence:
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_wohnzimmer_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.wohnzimmer_couch, light.wohnzimmer_schrank   
          - service: light.turn_off
            entity_id: light.weihnachtsstern, light.balkon_lichterkette
            
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_schlafzimmer_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.bett, light.kleiderschrank
            
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_kueche_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.kueche_regal, light.kueche_schrank
            
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_badezimmer_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.badezimmerschrank
            
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_flur_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.flur_vorne, light.flur_hinten
            
      - if: "{{ is_state('person.franzi', 'not_home') and ((override is defined and override == true) or is_state('input_boolean.bewegungsmelder_zimmer_franzi_deaktiviert', 'off')) }}"
        then:
          - service: light.turn_off
            entity_id: light.zimmer_franzi_licht
            
      - if: "{{ is_state('person.aaron', 'not_home') and ((override is defined and override == true) or is_state('input_boolean.bewegungsmelder_zimmer_aaron_deaktiviert', 'off')) }}"
        then:
          - service: light.turn_off
            entity_id: light.zimmer_aaron_licht
            
      - if: "{{ (override is defined and override == true) or is_state('input_boolean.bewegungsmelder_balkon_deaktiviert', 'off') }}"
        then:
          - service: light.turn_off
            entity_id: light.balkon_licht