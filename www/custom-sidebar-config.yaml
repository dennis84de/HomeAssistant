order:   
  - new_item: true
    bottom: true
    item: Integrationen
    href: "/config/integrations"
    icon: mdi:puzzle
    
  - new_item: true
    bottom: true
    item: Entitäten
    href: "/config/entities"
    icon: mdi:hexagon-multiple
    
  - new_item: true
    bottom: true
    item: Automationen
    href: "/config/automation"
    icon: mdi:robot
    
  - item: hacs
    bottom: true
    
  - new_item: true
    item: Logs
    bottom: true
    href: "/config/logs"
    icon: mdi:math-log
    
  - new_item: true
    item: 'Neustart'
    icon: 'mdi:restart-alert'
    on_click:
      action: 'javascript'
      code: |
        openConfirmDialog({
            title: 'Home Assistant neustarten?',
            text: 'Dadurch werden alle laufenden Automationen und Skripte unterbrochen!',
            confirmText: 'Neustarten',
            dismissText: 'Abbrechen',
            destructive: true,
            confirm: () => {
              callService('script', 'homeassistant_neustart');
            }
          });
    bottom: true
    
  - new_item: true
    item: 'Neuladen'
    icon: 'mdi:reload'
    on_click:
      action: 'javascript'
      code: |
        callService('homeassistant', 'reload_all');
    bottom: true
    
  - new_item: true
    item: Dev Tools
    href: "/developer-tools/yaml"
    icon: mdi:hammer-screwdriver
    bottom: true
    
  - item: settings
    bottom: true   